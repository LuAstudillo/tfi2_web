<body>
    <nav>
        <div class="logo"> Busca Hoteles Ya</div>

            <a href="index.html">Inicio</a>

        </div>

    <main>
    <h1> Contacto</h1>
    <p>Podés contactarnos si tenes dudas sobre tu reserva o sugerencias.</p>
    <form action="" name="formContacto" onsubmit="validarForm(event)" novalidate>
        <div class="formulario">
        
        <section>
            <h2>Tus datos:</h2>
        <div class="campo">
            <label for="fname">Ingrese su nombre<span class="obligatorio">*</span></label>
            <input type="text" name="name" id="fname"  value="">
            <span id="errorName" class="error"></span>
        </div>
        <div class="campo">
            <label for="fcorreo">Ingrese su correo electrónico<span class="obligatorio">*</span></label>
            <input type="text" name="correo" id="fcorreo"><br>
            <span id="errorCorreo" class="error"></span>
        </div>
        <div class="campo">
            <label for="ftelefono">Ingrese su número teléfono<span class="obligatorio">*</span></label>
            <input type="tel" name="telefono" id="ftelefono"><br>
            <span id="errorTelefono" class="error"></span>
        </div>
        <div class="campo">
            <label for="fmensaje"> Ingrese su sugerencia, o dudas sobre la reserva<span class="obligatorio">*</span></label>
            <input type="text" name="mensaje" id="fmensaje">
            <span id="errorMensaje" class="error"></span>
        
        
        </div>
        <br>
        <div class="button">
        <button type="submit" >Enviar</button>
        </div>
        </section>
    </form>
</div>
    
    <div id="formResumen" class="resumen"></div> 
</main>
    <footer>
        <p>©2026 Busca Hoteles Ya - TFI</p>
